name: Oura Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historie in Tagen"
        required: false
        default: "400"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r sync/requirements.txt

      - name: Run backfill
        env:
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync/backfill.py --days ${{ inputs.days }}
