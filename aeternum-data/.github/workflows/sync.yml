name: Oura Sync

on:
  schedule:
    - cron: "30 5 * * *"   # täglich 05:30 UTC (06:30/07:30 Europe/Berlin)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: oura-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r sync/requirements.txt

      - name: Run sync (letzte 14 Tage)
        env:
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync/sync.py

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Oura-Sync fehlgeschlagen (${today})`,
              body: [
                'Der tägliche Oura-Sync ist fehlgeschlagen.',
                '',
                `Workflow-Run: ${runUrl}`,
                '',
                'Typische Ursachen: abgelaufener `OURA_TOKEN`, Supabase nicht erreichbar, Schema-Drift.',
              ].join('\n'),
              labels: ['sync-failure'],
            });
