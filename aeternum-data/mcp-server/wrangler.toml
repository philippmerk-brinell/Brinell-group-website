name = "aeternum-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Baselines für get_trend / training_light — hier anpassbar, keine Secrets.
[vars]
HRV_BASELINE = "31"
RHR_BASELINE = "58"

[observability]
enabled = true

# Secrets (NICHT hier eintragen, via CLI setzen):
#   wrangler secret put MCP_BEARER_TOKEN
#   wrangler secret put MCP_DB_URL
